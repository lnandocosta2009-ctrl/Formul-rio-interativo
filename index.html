<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <script src="index.js" defer></script>
    <title>Fromulário Interativo</title>s
</head>
<body>
    <section class="containerPai">
        <div class="card cadastroActive">
            <div class="esquerda">
                <div class="formLogin">
                    <h1>Fazer Login</h1>
                    <form>
                        <input type="text" placeholder="E-mail">
                        <input type="password" placeholder="Senha">
                        <button type="submit">Entrar</button> 
                    </form>
                </div>
                <div class="facaLogin">
                    <h1>Já tem </br>uma conta? </h1>
                    <p>Faça parte da nossa comunidade, e realize seus sonhos!</p>
                    <button class="loginButton" type="submit">Faça Login</button>
                </div>
            </div>
            <div class="direita">
                 <div class="formCadastro">
                    <h1>Cadastro</h1>
                    <form>
                        <input type="text" placeholder="Nome">
                        <input type="text" placeholder="E-mail">
                        <input type="password" placeholder="Senha">
                        <input type="password" placeholder="Confirme Senha">
                        <button type="submit">Cadastrar</button> 
                    </form>
                 </div>
                 <div class="facaCadastro">
                    <h1>Não tem </br> uma conta?</h1>
                    <p>Faça parte da nossa familia</p>
                    <button class="cadastroButton">Cadastre-se</button>
                 </div>
            </div>
            
        </div>
    </section>
</body>
</html>
